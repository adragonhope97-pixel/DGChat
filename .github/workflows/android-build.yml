name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 JDK 21（Capacitor 8 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: npm install

      - name: 同步 Web 资源到安卓工程
        run: npx cap sync android

      - name: 编译 Debug APK（可直接安装）
        run: |
          cd android
          # 规范化 gradlew 换行（Windows 导出可能带 CRLF，Linux 下 shebang 会失效）
          sed -i 's/$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 整理产物
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/dgchat-debug.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dgchat-debug-apk
          path: dist/dgchat-debug.apk
          retention-days: 30
