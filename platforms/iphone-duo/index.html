<!DOCTYPE html>
<!-- DGChat iPhone Duo 独立适配版入口（本目录专有，独立于 web/index.html）
     运行方式见 README.md；API 通过 config/serve.mjs 代理到现有 DGChat 后端 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DGChat Duo</title>
  <link rel="stylesheet" href="styles/duo.css" />
</head>
<body data-duo-mode="single" data-duo-tab="posts">
  <header class="duo-topbar">
    <img class="duo-logo" src="../../web/assets/logo.png" alt="" onerror="this.style.display='none'" />
    <span class="duo-title">DGChat Duo</span>

    <div class="duo-actions">
      <button class="duo-icon" id="duoBtnSearch" title="搜索"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <button class="duo-icon" id="duoBtnNotif" title="通知"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="duo-badge" id="duoNotifBadge" hidden></span></button>
      <button class="duo-icon" id="duoBtnCompose" title="发帖"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <span class="duo-state-label" id="duoStateLabel"></span>
    <button class="duo-tab" id="duoLogout" hidden>退出</button>
  </header>

  <!-- 登录（独立会话，与主站令牌隔离） -->
  <div class="duo-login" id="duoLogin" hidden>
    <form id="duoLoginForm">
      <b>DGChat Duo 登录</b>
      <input id="duoLoginUser" type="text" autocomplete="username" placeholder="用户名或邮箱" required />
      <input id="duoLoginPass" type="password" autocomplete="current-password" placeholder="密码" required />
      <p class="duo-login-error" id="duoLoginError" hidden></p>
      <button type="submit">登 录</button>
    </form>
  </div>

  <!-- 双栏舞台：左列表 + 右详情（展开态两栏同显，闭合态单栏切换） -->
  <main class="duo-stage" id="duoApp" hidden>
    <!-- 动态模块 -->
    <section class="duo-pane" id="duoPostsPane" data-pane="list">
      <div class="duo-pane-head">动态列表</div>
      <div class="duo-pane-scroll" id="duoPostList"></div>
    </section>
    <section class="duo-pane" id="duoDetailPane" data-pane="detail">
      <div class="duo-pane-head">动态详情</div>
      <div class="duo-pane-scroll" id="duoDetailBody">
        <div class="duo-empty">从左侧选择一条动态查看详情</div>
      </div>
    </section>

    <!-- 聊天模块 -->
    <section class="duo-pane" id="duoChatPane" data-pane="list">
      <div class="duo-pane-head">会话列表</div>
      <div class="duo-pane-scroll" id="duoConvList"></div>
    </section>
    <section class="duo-pane" id="duoThreadPane" data-pane="detail">
      <div class="duo-pane-head" id="duoThreadName">对话</div>
      <div class="duo-pane-scroll" id="duoMsgList">
        <div class="duo-empty">从左侧选择一个会话</div>
      </div>
      <div class="duo-reply-bar" id="duoReplyBar" hidden>
        <span id="duoReplyPreview"></span>
        <button id="duoReplyCancel">✕</button>
      </div>
      <div class="duo-input-bar">
        <textarea id="duoMsgInput" rows="1" maxlength="2000" placeholder="发消息…"></textarea>
        <button id="duoSend">发送</button>
      </div>
    </section>
  </main>

  <!-- 底部导航（四标签） -->
  <nav class="duo-tabbar" id="duoTabbar">
    <span class="duo-tab-ind" id="duoTabInd"></span>
    <button class="duo-tab active" data-tab="posts" id="duoTabPosts">动态</button>
    <button class="duo-tab" data-tab="discover" id="duoTabDiscover">发现</button>
    <button class="duo-tab" data-tab="chat" id="duoTabChat">聊天<span class="duo-unread" id="duoUnread" hidden></span></button>
    <button class="duo-tab" data-tab="me" id="duoTabMe">我的</button>
  </nav>

  <!-- 发现视图（全宽，双栏模块之外） -->
  <section class="duo-fullview" id="duoDiscoverView" hidden>
    <div class="duo-seg" id="duoDiscoverSeg">
      <button class="duo-tab active" data-disc="recommend">推荐用户</button>
      <button class="duo-tab" data-disc="topics">热门话题</button>
      <button class="duo-tab" data-disc="latest">最新动态</button>
      <button class="duo-tab" data-disc="hot">热门动态</button>
    </div>
    <div class="duo-pane-scroll" id="duoDiscoverBody"></div>
  </section>

  <!-- 我的视图（全宽） -->
  <section class="duo-fullview" id="duoMeView" hidden>
    <div class="duo-pane-scroll" id="duoMeBody"></div>
  </section>

  <!-- 发帖 -->
  <div class="duo-mask" id="duoComposeModal" hidden>
    <div class="duo-sheet">
      <div class="duo-sheet-head"><b>发布动态</b><button class="duo-close" data-close="duoComposeModal">✕</button></div>
      <form id="duoComposeForm">
        <select id="duoComposeBoard" class="duo-field"></select>
        <input id="duoComposeTitle" class="duo-field" type="text" maxlength="60" placeholder="标题（最多 60 字）" required />
        <textarea id="duoComposeContent" class="duo-field" rows="5" maxlength="5000" placeholder="正文…用 #话题名# 可创建话题"></textarea>
        <div class="duo-img-picker">
          <div id="duoComposeThumbs" class="duo-thumbs"></div>
          <label class="duo-btn small">＋ 图片<input id="duoComposeImg" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden /></label>
        </div>
        <div class="duo-row">
          <select id="duoComposeVis" class="duo-field half"><option value="public">公开</option><option value="private">仅自己可见</option></select>
          <label class="duo-check"><input type="checkbox" id="duoComposeAnon" />匿名</label>
        </div>
        <p class="duo-hint" id="duoComposeState"></p>
        <p class="duo-error" id="duoComposeError" hidden></p>
        <div class="duo-row">
          <button type="button" class="duo-btn" id="duoComposeDraft">存草稿</button>
          <button type="button" class="duo-btn primary" id="duoComposeSubmit">发 布</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 搜索 -->
  <div class="duo-mask" id="duoSearchModal" hidden>
    <div class="duo-sheet">
      <div class="duo-sheet-head"><b>搜索</b><button class="duo-close" data-close="duoSearchModal">✕</button></div>
      <div class="duo-row">
        <input id="duoSearchQuery" class="duo-field" type="search" maxlength="60" placeholder="用户 / 动态 / #话题#" />
        <button class="duo-btn primary" id="duoSearchGo">搜索</button>
      </div>
      <div class="duo-row" id="duoSearchTabs">
        <button class="duo-btn small duo-search-tab active" data-stab="posts">动态</button>
        <button class="duo-btn small duo-search-tab" data-stab="users">用户</button>
        <button class="duo-btn small duo-search-tab" data-stab="topics">话题</button>
        <select id="duoSearchSort" class="duo-field half"><option value="latest">最新</option><option value="relevance">相关度</option></select>
      </div>
      <div id="duoSearchResults"></div>
    </div>
  </div>

  <!-- 通知 -->
  <div class="duo-mask" id="duoNotifModal" hidden>
    <div class="duo-sheet">
      <div class="duo-sheet-head"><b>通知中心</b><button class="duo-btn small" id="duoNotifReadAll">全部已读</button><button class="duo-close" data-close="duoNotifModal">✕</button></div>
      <div id="duoNotifList"></div>
    </div>
  </div>

  <!-- 收藏到文件夹 -->
  <div class="duo-mask" id="duoFolderModal" hidden>
    <div class="duo-sheet">
      <div class="duo-sheet-head"><b>收藏到…</b><button class="duo-close" data-close="duoFolderModal">✕</button></div>
      <div id="duoFolderList" class="duo-folder-list"></div>
    </div>
  </div>

  <!-- 话题详情 -->
  <div class="duo-mask" id="duoTopicModal" hidden>
    <div class="duo-sheet">
      <div class="duo-sheet-head"><b id="duoTopicName">#话题</b><button class="duo-close" data-close="duoTopicModal">✕</button></div>
      <div id="duoTopicPosts"></div>
    </div>
  </div>

  <!-- 隐私与互动 -->
  <div class="duo-mask" id="duoPrivacyModal" hidden>
    <div class="duo-sheet">
      <div class="duo-sheet-head"><b>隐私与互动</b><button class="duo-close" data-close="duoPrivacyModal">✕</button></div>
      <label class="duo-check"><input type="checkbox" id="duoPrivacyPrivate" /><span>私密账号（动态仅关注者可见，关注需审批）</span></label>
      <label class="duo-field-label">谁可以给我发私信</label>
      <select id="duoPrivacyDm" class="duo-field"><option value="everyone">所有人</option><option value="following">我关注的人</option></select>
      <label class="duo-field-label">谁可以评论我的动态</label>
      <select id="duoPrivacyComment" class="duo-field"><option value="everyone">所有人</option><option value="following">我关注的人</option></select>
      <label class="duo-check"><input type="checkbox" id="duoPrivacySearch" /><span>保留本机搜索历史</span></label>
      <button class="duo-btn primary wide" id="duoPrivacySave">保 存</button>
    </div>
  </div>

  <!-- 收藏夹管理 -->
  <div class="duo-mask" id="duoFavMgrModal" hidden>
    <div class="duo-sheet">
      <div class="duo-sheet-head"><b>我的收藏</b><button class="duo-close" data-close="duoFavMgrModal">✕</button></div>
      <div class="duo-row" id="duoFavMgrFolders"></div>
      <div id="duoFavMgrPosts"></div>
      <button class="duo-btn wide" id="duoFavMgrMore" hidden>加载更多</button>
    </div>
  </div>

  <!-- 账号安全 -->
  <div class="duo-mask" id="duoSecurityModal" hidden>
    <div class="duo-sheet">
      <div class="duo-sheet-head"><b>账号安全</b><button class="duo-close" data-close="duoSecurityModal">✕</button></div>
      <div id="duoSecurityBody"></div>
    </div>
  </div>

  <!-- 用户资料 -->
  <div class="duo-mask" id="duoUserModal" hidden>
    <div class="duo-sheet" id="duoUserBox"></div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="config/duo.config.js"></script>
  <script src="src/window-state.js"></script>
  <script src="src/api.js"></script>
  <script src="components/duo-panes.js"></script>
  <script src="src/duo-app.js"></script>
  <script src="src/duo-features.js"></script>
</body>
</html>
